<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anirudh's Site</title>
</head>
<body>
  <script>
    // Get the current path (without the domain)
    var currentPath = window.location.pathname;

    // If the path is the root ("/"), append nothing to the new domain
    var redirectUrl = currentPath === "/" ? "https://a-star100.github.io" : "https://a-star100.github.io" + currentPath;

    // Redirect to the new URL
    window.location.replace(redirectUrl);
  </script>
</body>
</html>
